<div class="layout-container">
  <p-toast position="top-right" [baseZIndex]="9999" appendTo="body" />
  <p-confirmdialog [style]="{ width: '450px', maxWidth: '90vw' }" appendTo="body" />

  <app-navbar (toggleSidebar)="toggleSidebar()" />

  <div class="layout-main-wrapper">
    <!-- Desktop sidebar -->
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      class="desktop-sidebar" />

    <!-- Mobile overlay -->
    @if (mobileMenuOpen()) {
      <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
      <app-sidebar
        [collapsed]="false"
        class="mobile-sidebar" />
    }

    <main class="layout-content-wrapper">
      <div class="content-inner animate-fade-in">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
