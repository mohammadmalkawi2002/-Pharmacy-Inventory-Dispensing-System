<div class="user-create-page space-y-6 animate-fade-in">
  <div class="card-glass p-6 md:p-8">
    <div class="flex items-center gap-4 mb-6 border-b border-surface-200 pb-4">
      <div class="w-12 h-12 rounded-xl bg-blue-100 text-primary flex items-center justify-center text-xl font-bold">
        <i class="pi pi-user-plus"></i>
      </div>
      <div>
        <h2 class="text-2xl font-black text-surface-900 tracking-tight">Enroll New Staff Member</h2>
        <p class="text-sm text-surface-500">Create a new system account and assign permissions.</p>
      </div>
    </div>

    <app-user-form 
      [isSubmitting]="isSubmitting()"
      (save)="onSave($event)"
      (cancel)="onCancel()" />
  </div>
</div>
