<div class="login-page-wrapper">
  <p-toast appendTo="body" />

  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card card-glass animate-fade-in relative z-10">
    <!-- Brand Header -->
    <div class="login-header">
      <div class="login-logo-badge">
        <i class="pi pi-lock"></i>
      </div>
      <h2 class="login-title">Reset Password</h2>
      <p class="login-subtitle">Enter your email to receive a reset link</p>
    </div>

    <!-- Success State -->
    <div *ngIf="successMessage" class="text-center py-6 animate-fade-in">
      <i class="pi pi-check-circle text-6xl text-emerald-500 mb-4"></i>
      <h3 class="text-xl font-bold mb-2">Check your email</h3>
      <p class="text-surface-500 text-sm mb-6">We've sent a password reset link to your email address.</p>
      <p-button
        routerLink="/login"
        label="Return to Login"
        severity="secondary"
        styleClass="w-full text-base font-bold" />
    </div>

    <!-- Forgot Form -->
    <form *ngIf="!successMessage" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-with-icon">
          <i class="pi pi-envelope form-icon"></i>
          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            placeholder="practitioner@pharmacare.org"
            class="w-full"
            [class.ng-invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" />
        </div>
        <div *ngIf="forgotForm.get('email')?.hasError('required') && forgotForm.get('email')?.touched">
          <small class="form-error">Email is required.</small>
        </div>
        <div *ngIf="forgotForm.get('email')?.hasError('email') && forgotForm.get('email')?.touched">
          <small class="form-error">Please enter a valid email address.</small>
        </div>
      </div>

      <!-- Submit Button -->
      <p-button
        type="submit"
        [label]="isSubmitting ? 'Sending Link...' : 'Send Reset Link'"
        [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-envelope'"
        [disabled]="isSubmitting"
        severity="primary"
        styleClass="w-full shadow-md py-3 text-base font-bold mt-2" />

      <div class="text-center mt-6">
        <a routerLink="/login" class="text-sm text-surface-500 hover:text-primary transition-colors font-medium">
          <i class="pi pi-arrow-left text-xs mr-1"></i> Back to login
        </a>
      </div>
    </form>
  </div>
</div>
